<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wörter im Text finden</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --success: #27ae60;
            --highlight: #f1c40f;
            --bg: #f4f7f6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
        }

        .instruction {
            margin-bottom: 20px;
            font-size: 1.1rem;
            line-height: 1.4;
        }

        .text-block {
            background: #fff;
            border: 2px solid #ecf0f1;
            padding: 25px;
            border-radius: 10px;
            line-height: 2.2;
            font-size: 1.3rem;
            text-align: left;
            margin-bottom: 25px;
            user-select: none;
        }

        /* Jedes Wort wird ein klickbares Element */
        .word {
            display: inline-block;
            padding: 0 4px;
            margin: 0 1px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .word:hover {
            background-color: #ecf0f1;
        }

        /* Markiert, wenn richtig gefunden */
        .found {
            background-color: var(--highlight) !important;
            font-weight: bold;
            border-bottom: 2px solid var(--primary);
        }

        .stats {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        .feedback {
            color: var(--success);
            font-weight: bold;
            display: none;
            margin-bottom: 20px;
        }

        .btn-reset {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s;
        }

        .btn-reset:hover { background: #34495e; }

        @media (max-width: 480px) {
            .text-block { font-size: 1.1rem; padding: 15px; }
            .container { padding: 20px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Wörter finden</h2>
    <p class="instruction">Lies den Text. Klicke auf alle Formen des Verbs <b>купиться</b> (reinfallen), um sie zu markieren.</p>

    <div class="stats">Gefunden: <span id="count">0</span> von 4</div>

    <div class="text-block" id="textBlock">
        <!-- Text wird per JS eingefügt -->
    </div>

    <div id="feedback" class="feedback">Ausgezeichnet! Du hast alle Formen im Text entdeckt. 🎉</div>
    <button class="btn-reset" onclick="resetTask()">Neustart</button>
</div>

<script>
    const originalText = "Мой брат решил меня разыграть. Он сказал, что мы едем в отпуск сегодня. Я сразу купился и начал собирать чемодан. Потом он рассказал об этом маме, и мама тоже купилась. Мы были так рады! Но когда пришёл папа, он рассмеялся. Мы поняли, что это шутка. Мы все купились на этот розыгрыш. А ты когда-нибудь так купился?";

    const targetWords = ["купился", "купилась", "купились"];
    let foundCount = 0;
    const totalToFind = 4;

    function initTask() {
        const textBlock = document.getElementById('textBlock');
        const words = originalText.split(' ');
        textBlock.innerHTML = '';
        foundCount = 0;
        updateStats();
        document.getElementById('feedback').style.display = 'none';

        words.forEach((word, index) => {
            const span = document.createElement('span');
            // Satzzeichen für den Vergleich entfernen
            const cleanWord = word.toLowerCase().replace(/[.,!?;]/g, "");
            
            span.innerText = word + " ";
            span.className = 'word';
            
            span.onclick = () => {
                if (!span.classList.contains('found') && targetWords.includes(cleanWord)) {
                    span.classList.add('found');
                    foundCount++;
                    updateStats();
                    checkWin();
                }
            };
            textBlock.appendChild(span);
        });
    }

    function updateStats() {
        document.getElementById('count').innerText = foundCount;
    }

    function checkWin() {
        if (foundCount === totalToFind) {
            document.getElementById('feedback').style.display = 'block';
        }
    }

    function resetTask() {
        initTask();
    }

    // Initialisierung
    initTask();
</script>

</body>
</html>
